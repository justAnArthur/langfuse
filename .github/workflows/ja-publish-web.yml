# just-agents fork: builds the web image with the Agents section and pushes it
# to ghcr.io/justanarthur/langfuse-web. Tag the just-agents branch as
# `ja/<upstream version>-ja.<n>`, e.g. `ja/4.52.0-ja.1`; the image takes the
# part after `ja/`. The worker stays upstream's image of the same version.
name: ja-publish-web

on:
  push:
    tags: ["ja/*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag, e.g. 4.52.0-ja.1"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve image tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "tag=${INPUT_VERSION:-${GITHUB_REF_NAME#ja/}}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_SIGN_UP_DISABLED=true
          tags: ghcr.io/justanarthur/langfuse-web:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
